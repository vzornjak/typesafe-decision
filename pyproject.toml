[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "typesafe-decision"
version = "2.5.0"
description = "Unofficial advisory decision layer using TypeSafe Jev as a typed sensor for ranking, verification, routing and action-risk triage."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "typesafe-decision contributors" }]
keywords = ["agent", "skill", "reranking", "rag", "shortlist", "routing", "typesafe", "jev", "advisory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]
# Runtime dependencies: none, by design. Standard library only, so the scripts
# run inside constrained agent sandboxes. See CONTRIBUTING.md.
dependencies = []

[project.urls]
Homepage = "https://github.com/vzornjak/typesafe-decision"
Source = "https://github.com/vzornjak/typesafe-decision"
Issues = "https://github.com/vzornjak/typesafe-decision/issues"
Changelog = "https://github.com/vzornjak/typesafe-decision/blob/main/CHANGELOG.md"
Security = "https://github.com/vzornjak/typesafe-decision/blob/main/SECURITY.md"
"Upstream (TypeSafe)" = "https://typesafe.ai"
"Upstream docs" = "https://docs.typesafe.ai/llms.txt"

[tool.setuptools]
# The project ships as scripts plus an agent SKILL.md rather than an importable
# package; nothing is installed into site-packages.
packages = []

# --------------------------------------------------------------------------
# Tests
#
# The canonical entry point is:      python3 tests/run_tests.py
# It runs py_compile, selftest (25), regressions (119), fixture integrity and
# the secret / absolute-path hygiene scans, and prints one JSON report.
#
# pytest is optional and not required. When it is available, the settings below
# let `pytest tests/` collect the same suite through tests/test_suite.py.
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
exclude = ["references", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
  "E501",  # long lines are tolerated in the dense test suite
  "E701",  # compound statements exist in the legacy selftest on purpose
  "E702",
  "B008",
]
